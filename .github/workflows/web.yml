name: Web
on:
  push:
  workflow_dispatch:
jobs:
  build:
      runs-on: ubuntu-latest
      container:
        image: ${{ vars.AE_BUILD_IMAGE || 'ghcr.io/johnhues/aether-build:latest' }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk
        run: |
          case "$(uname -m)" in
            x86_64) ARCH=x86_64; SHA=55fc523ebfbc98f69d1034fcfcb83d1ff5610cd9ab7eceef6cd097a30ba4ef93 ;;
            aarch64) ARCH=arm64; SHA=b2070865e6cb0c1e97a38e6ac8d9c37a9dfcd0752764ebabc6bacd3e60cedb96 ;;
          esac
          wget -q "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-32/wasi-sdk-32.0-${ARCH}-linux.tar.gz" -O wasi-sdk.tar.gz
          echo "${SHA}  wasi-sdk.tar.gz" | sha256sum -c -
          mkdir -p /opt/wasi-sdk && tar xzf wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: Configure
        run: cmake -S . -B build_ci -G Ninja -DCMAKE_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake -DCMAKE_BUILD_TYPE=Release -DAE_LEAN_AND_MEAN=OFF -DAE_LOADERS_OFBX=ON
      - name: Build
        run: cmake --build build_ci
      - name: Configurations
        run: WASI_SDK_PATH=/opt/wasi-sdk test/config/check.sh wasi
      - name: Examples
        run: node test/web/check.js build_ci/examples/Release
      - name: Collect Examples
        uses: actions/upload-artifact@v4
        with:
          name: web-examples
          path: build_ci/examples/Release
          retention-days: 1

  # aether as a guest in an Emscripten program, see test/emscripten
  emscripten-guest:
      runs-on: ubuntu-latest
      container:
        image: ${{ vars.AE_BUILD_IMAGE || 'ghcr.io/johnhues/aether-build:latest' }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      defaults:
        run:
          shell: bash # emsdk_env.sh needs bash to find its directory
      steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install 6.0.0
          /opt/emsdk/emsdk activate 6.0.0
      - name: Build
        run: . /opt/emsdk/emsdk_env.sh && test/emscripten/build.sh build_emscripten_test
      - name: Page
        run: node test/web/check.js build_emscripten_test --expect-log "Rendered 60 frames"
      - name: Configurations
        run: . /opt/emsdk/emsdk_env.sh && test/config/check.sh emscripten

  # The docs site flung up and down, see test/web/scroll.js
  docs-scroll:
      needs: build
      runs-on: ubuntu-latest
      container:
        image: ${{ vars.AE_BUILD_IMAGE || 'ghcr.io/johnhues/aether-build:latest' }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      steps:
      - uses: actions/checkout@v4
      - name: Fetch Examples
        uses: actions/download-artifact@v4
        with:
          name: web-examples
          path: web-examples
      - name: Build Site
        # docs.py downloads its pinned doxygen release
        run: python3 scripts/docs.py publish --yes --no-open --config-dir web-examples --out _site
      - name: Scroll
        run: node test/web/scroll.js _site

  publish-docs:
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      needs: [ build, docs-scroll ]
      runs-on: ubuntu-latest
      permissions:
        pages: write
        id-token: write
      environment:
        name: github-pages
        url: ${{ steps.deploy.outputs.page_url }}
      steps:
      - uses: actions/checkout@v4
      - name: Fetch Examples
        uses: actions/download-artifact@v4
        with:
          name: web-examples
          path: web-examples
      - name: Build Site
        # docs.py downloads its pinned doxygen release
        run: python3 scripts/docs.py publish --yes --config-dir web-examples --out _site
      - name: Check Site
        run: |
          test -f _site/index.html
          test -d _site/examples
          echo "pages: $(ls _site/*.html | wc -l), examples: $(ls _site/examples | wc -l)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
